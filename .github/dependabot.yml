version: 2

updates:
    - package-ecosystem: npm
      directory: /
      cooldown:
          default-days: 2
      ignore:
          - dependency-name: typescript
      schedule:
          interval: weekly
          day: monday
          time: '09:00'
          timezone: America/New_York
      open-pull-requests-limit: 1
      groups:
          npm-dependencies:
              patterns:
                  - '*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '09:00'
          timezone: America/New_York
      open-pull-requests-limit: 1
      groups:
          workflow-actions:
              patterns:
                  - '*'
