name: Bug report
description: Report reproducible behavior that is not working as intended.
title: '[Bug]: '
body:
    - type: markdown
      attributes:
          value: |
              Thanks for helping improve TOCus. Remove private URLs, browsing data, and credentials before submitting.

              If this could be a security vulnerability, stop and report it privately through GitHub Security Advisories instead.

    - type: input
      id: version
      attributes:
          label: Version or commit
          description: Provide the extension version or commit hash you tested.
          placeholder: 0.0.0 or abc1234
      validations:
          required: true

    - type: dropdown
      id: browser
      attributes:
          label: Browser
          options:
              - Chrome or another Chromium-based browser
              - Firefox
              - Not browser-specific or website only
      validations:
          required: true

    - type: input
      id: browser-version
      attributes:
          label: Browser version
          placeholder: Firefox 147.0.2 or Chrome 147.0.7727.15
      validations:
          required: true

    - type: input
      id: operating-system
      attributes:
          label: Operating system
          placeholder: macOS 15, Windows 11, or Ubuntu 24.04
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: List the smallest reliable sequence that triggers the problem.
          placeholder: |
              1. Open ...
              2. Select ...
              3. Observe ...
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: What did you expect to happen?
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
          description: What happened instead? Include any visible error text.
      validations:
          required: true

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Add sanitized logs, screenshots, or other useful details.

    - type: checkboxes
      id: preflight
      attributes:
          label: Preflight checks
          options:
              - label: I searched existing issues for this problem.
                required: true
              - label: This report does not disclose a security vulnerability.
                required: true
              - label: I removed secrets and personal browsing data.
                required: true
