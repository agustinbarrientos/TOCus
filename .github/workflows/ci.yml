name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Check and build
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Node.js and pnpm
              uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
              with:
                  runtime: node@24.20.0
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit high-severity vulnerabilities
              run: pnpm audit --audit-level=high

            - name: Install pinned Chromium
              run: pnpm --filter @tocus/extension exec playwright install --with-deps chromium

            - name: Run quality checks
              run: pnpm check
